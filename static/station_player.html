<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{STATION_NAME}} • بث مباشر</title>
    <meta name="description" content="{{STATION_DESC}}">
    <meta property="og:title" content="{{STATION_NAME}}">
    <meta property="og:description" content="{{STATION_DESC}}">
    <meta property="og:type" content="music.radio_station">
    <meta property="og:url" content="{{PAGE_URL}}">
    <style>
        :root {
            --theme-bg1: {{THEME_BG1}};
            --theme-bg2: {{THEME_BG2}};
            --theme-accent: {{THEME_ACCENT}};
            --theme-glow: {{THEME_GLOW}};
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--theme-bg1) 0%, #080c14 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: var(--theme-glow);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .live-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        /* Player Card Content */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        /* Artwork Icon Cover */
        .art-box {
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px var(--theme-glow);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            margin-bottom: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .art-box.playing {
            animation: floatArt 3s ease-in-out infinite;
            border-color: var(--theme-accent);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 45px var(--theme-glow);
        }

        @keyframes floatArt {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        .station-name {
            font-size: 23px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .station-category {
            font-size: 13px;
            color: var(--theme-accent);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .station-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
            max-width: 380px;
        }

        /* Animated Audio Visualizer Bars */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 36px;
            margin-bottom: 24px;
        }

        .bar {
            width: 4px;
            height: 6px;
            background: var(--theme-accent);
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .visualizer.active .bar:nth-child(1) { animation: bounce 0.9s infinite alternate; }
        .visualizer.active .bar:nth-child(2) { animation: bounce 0.6s infinite 0.1s alternate; }
        .visualizer.active .bar:nth-child(3) { animation: bounce 1.1s infinite 0.2s alternate; }
        .visualizer.active .bar:nth-child(4) { animation: bounce 0.7s infinite 0.3s alternate; }
        .visualizer.active .bar:nth-child(5) { animation: bounce 1.0s infinite 0.15s alternate; }
        .visualizer.active .bar:nth-child(6) { animation: bounce 0.8s infinite 0.25s alternate; }
        .visualizer.active .bar:nth-child(7) { animation: bounce 1.2s infinite 0.05s alternate; }

        @keyframes bounce {
            0% { height: 6px; opacity: 0.4; }
            100% { height: 32px; opacity: 1; }
        }

        /* Large Touch Play Button */
        .play-btn-circle {
            width: 82px;
            height: 82px;
            background: var(--theme-accent);
            color: #040812;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 24px var(--theme-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 24px;
        }

        .play-btn-circle:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 36px var(--theme-glow);
        }

        .play-btn-circle:active {
            transform: scale(0.95);
        }

        /* Volume Slider Row */
        .vol-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 220px;
            margin-bottom: 28px;
        }

        .vol-icon {
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
        }

        .vol-slider {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            accent-color: var(--theme-accent);
        }

        /* Action Buttons Grid */
        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--theme-accent);
        }

        /* Station Switcher Drawer */
        footer {
            position: relative;
            z-index: 10;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .other-stations-link {
            color: var(--theme-accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .other-stations-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Header -->
    <header>
        <a href="/" class="back-link">
            <span>←</span>
            <span>استوديو المحطات</span>
        </a>
        <div class="live-chip">
            <span class="pulse-dot"></span>
            <span>بث مباشر • 128K MP3</span>
        </div>
    </header>

    <!-- Main Player Card -->
    <main>
        <!-- Icon Cover -->
        <div class="art-box" id="artBox">
            {{STATION_ICON}}
        </div>

        <h1 class="station-name">{{STATION_NAME}}</h1>
        <div class="station-category">{{STATION_CATEGORY}}</div>
        <p class="station-desc">{{STATION_DESC}}</p>

        <!-- Waveform Visualizer -->
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Big Play Button -->
        <button class="play-btn-circle" id="playBtn" onclick="togglePlay()">
            <span id="playIcon">▶</span>
        </button>

        <!-- Volume Control -->
        <div class="vol-container">
            <span class="vol-icon" id="volIcon" onclick="toggleMute()">🔊</span>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        </div>

        <!-- Download & Share Actions -->
        <div class="action-row">
            <a href="/station/{{STATION_ID}}.m3u" class="action-btn" download title="تحميل ملف التشغيل لويندوز ميديا بلاير">
                <span>📥</span>
                <span>تشغيل في WMP</span>
            </a>
            <button class="action-btn" onclick="shareStation()" title="مشاركة رابط المحطة">
                <span>🔗</span>
                <span>مشاركة الرابط</span>
            </button>
            <button class="action-btn" onclick="copyStreamUrl()" title="نسخ رابط البث المباشر">
                <span>📋</span>
                <span>نسخ البث</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <span>Designed and developed by <a href="https://xecod.com" target="_blank" style="color: var(--theme-accent); font-weight: bold; text-decoration: none;">xecod.com</a></span>
        </div>
        <a href="/" class="other-stations-link">
            <span>جميع المحطات</span>
            <span>→</span>
        </a>
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="audioStream" preload="none"></audio>

    <script>
        const stationId = "{{STATION_ID}}";
        const streamUrl = "/station/" + stationId;
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const artBox = document.getElementById('artBox');
        const visualizer = document.getElementById('visualizer');
        const volIcon = document.getElementById('volIcon');
        const volSlider = document.getElementById('volSlider');

        let isPlaying = false;

        function togglePlay() {
            if (!isPlaying) {
                audio.src = streamUrl;
                audio.play().then(() => {
                    isPlaying = true;
                    updateUI(true);
                }).catch(err => {
                    console.log("Playback error:", err);
                });
            } else {
                audio.pause();
                audio.src = "";
                isPlaying = false;
                updateUI(false);
            }
        }

        function updateUI(playing) {
            if (playing) {
                playIcon.textContent = "⏸";
                artBox.classList.add('playing');
                visualizer.classList.add('active');
            } else {
                playIcon.textContent = "▶";
                artBox.classList.remove('playing');
                visualizer.classList.remove('active');
            }
        }

        function changeVolume(val) {
            audio.volume = val;
            volIcon.textContent = val == 0 ? "🔇" : (val < 0.5 ? "🔉" : "🔊");
        }

        function toggleMute() {
            if (audio.volume > 0) {
                audio.volume = 0;
                volSlider.value = 0;
                volIcon.textContent = "🔇";
            } else {
                audio.volume = 1;
                volSlider.value = 1;
                volIcon.textContent = "🔊";
            }
        }

        function copyStreamUrl() {
            const fullUrl = window.location.origin + streamUrl;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert("تم نسخ رابط البث المباشر بنجاح:\n" + fullUrl);
            });
        }

        function shareStation() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: "استمع الآن إلى " + document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert("تم نسخ رابط المحطة للمشاركة:\n" + window.location.href);
                });
            }
        }

        // Keep connection awake if screen sleeps
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && isPlaying && audio.paused) {
                audio.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
