<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{STATION_NAME}} • بث مباشر</title>
    <meta name="description" content="{{STATION_DESC}}">
    <meta property="og:title" content="{{STATION_NAME}}">
    <meta property="og:description" content="{{STATION_DESC}}">
    <meta property="og:type" content="music.radio_station">
    <meta property="og:url" content="{{PAGE_URL}}">
    <style>
        :root {
            --theme-bg1: {{THEME_BG1}};
            --theme-bg2: {{THEME_BG2}};
            --theme-accent: {{THEME_ACCENT}};
            --theme-glow: {{THEME_GLOW}};
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--theme-bg1) 0%, var(--theme-bg2) 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            transition: background 3s ease;
        }

        /* =========================================
           Serene Celestial & Ambient Background
           ========================================= */
        .islamic-bg-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-radial-glow {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-glow) 0%, rgba(212, 175, 55, 0.08) 35%, transparent 70%);
            filter: blur(80px);
            animation: spiritualBreathe 8s ease-in-out infinite;
            will-change: transform, opacity;
            pointer-events: none;
            transition: all 0.8s ease;
        }

        .playing-active .ambient-radial-glow {
            animation: spiritualBreathe 4.5s ease-in-out infinite;
            background: radial-gradient(circle, var(--theme-glow) 0%, rgba(212, 175, 55, 0.20) 45%, transparent 70%);
            filter: blur(65px);
            width: 700px;
            height: 700px;
        }

        #celestialCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        /* Reduced, ultra-subtle 8-pointed star watermark */
        .subtle-star-wrap {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            max-width: 120vw;
            max-height: 120vw;
            opacity: 0.10;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .playing-active .subtle-star-wrap {
            opacity: 0.18;
        }

        @keyframes subtleRotateSlow {
            0% { transform: rotate(0deg) translateZ(0); }
            100% { transform: rotate(360deg) translateZ(0); }
        }

        .anim-subtle-spin {
            animation: subtleRotateSlow 180s linear infinite;
            transform-origin: 250px 250px;
            will-change: transform;
        }

        @keyframes spiritualBreathe {
            0%, 100% {
                opacity: 0.55;
                transform: translate(-50%, -50%) scale(0.96) translateZ(0);
            }
            50% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(1.06) translateZ(0);
            }
        }

        /* Dynamic Hijri Moon Container */
        .hijri-moon-wrap {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .hijri-moon-wrap:hover {
            transform: scale(1.05);
        }

        .moon-svg-box {
            filter: drop-shadow(0 0 10px rgba(255, 235, 170, 0.7)) drop-shadow(0 0 24px rgba(255, 215, 120, 0.35));
            animation: moonAuraPulse 6s ease-in-out infinite;
            transform-origin: center center;
            transition: transform 0.5s ease;
        }

        @keyframes moonAuraPulse {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 235, 170, 0.55)) drop-shadow(0 0 20px rgba(255, 215, 120, 0.25));
                opacity: 0.90;
            }
            50% {
                filter: drop-shadow(0 0 14px rgba(255, 240, 185, 0.85)) drop-shadow(0 0 32px rgba(255, 220, 130, 0.45));
                opacity: 1.0;
            }
        }

        .moon-hijri-caption {
            font-size: 10px;
            color: rgba(255, 245, 220, 0.75);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 4px;
            white-space: nowrap;
            letter-spacing: 0.3px;
            backdrop-filter: blur(6px);
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .hijri-moon-wrap {
                top: 12px;
                right: 12px;
            }
            .moon-svg-box {
                transform: scale(0.85);
            }
            .subtle-star-wrap {
                width: 380px;
                height: 380px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-subtle-spin,
            .ambient-radial-glow,
            .moon-svg-box {
                animation: none !important;
            }
        }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .live-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        /* Player Card Content */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        /* Artwork Icon Cover */
        .art-box {
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px var(--theme-glow);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            margin-bottom: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .art-box.playing {
            animation: floatArt 3s ease-in-out infinite;
            border-color: var(--theme-accent);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 45px var(--theme-glow);
        }

        @keyframes floatArt {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        .station-name {
            font-size: 23px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .station-category {
            font-size: 13px;
            color: var(--theme-accent);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .station-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
            max-width: 380px;
        }

        /* Animated Audio Visualizer Bars */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 36px;
            margin-bottom: 24px;
        }

        .bar {
            width: 4px;
            height: 6px;
            background: var(--theme-accent);
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .visualizer.active .bar:nth-child(1) { animation: bounce 0.9s infinite alternate; }
        .visualizer.active .bar:nth-child(2) { animation: bounce 0.6s infinite 0.1s alternate; }
        .visualizer.active .bar:nth-child(3) { animation: bounce 1.1s infinite 0.2s alternate; }
        .visualizer.active .bar:nth-child(4) { animation: bounce 0.7s infinite 0.3s alternate; }
        .visualizer.active .bar:nth-child(5) { animation: bounce 1.0s infinite 0.15s alternate; }
        .visualizer.active .bar:nth-child(6) { animation: bounce 0.8s infinite 0.25s alternate; }
        .visualizer.active .bar:nth-child(7) { animation: bounce 1.2s infinite 0.05s alternate; }

        @keyframes bounce {
            0% { height: 6px; opacity: 0.4; }
            100% { height: 32px; opacity: 1; }
        }

        /* Large Touch Play Button */
        .play-btn-circle {
            width: 82px;
            height: 82px;
            background: var(--theme-accent);
            color: #040812;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 24px var(--theme-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 24px;
        }

        .play-btn-circle:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 36px var(--theme-glow);
        }

        .play-btn-circle:active {
            transform: scale(0.95);
        }

        /* Volume Slider Row */
        .vol-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 220px;
            margin-bottom: 28px;
        }

        .vol-icon {
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
        }

        .vol-slider {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            accent-color: var(--theme-accent);
        }

        /* Action Buttons Grid */
        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--theme-accent);
        }

        /* Station Switcher Drawer */
        footer {
            position: relative;
            z-index: 10;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .other-stations-link {
            color: var(--theme-accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .other-stations-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Islamic Ambient Celestial Background -->
    <div class="islamic-bg-container" id="islamicBg">
        <div class="ambient-radial-glow"></div>
        <canvas id="celestialCanvas"></canvas>

        <!-- Subtle Ethereal Islamic Star Watermark (Reduced Graphics) -->
        <div class="subtle-star-wrap">
            <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                <defs>
                    <linearGradient id="faintGold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#AA7C11" stop-opacity="0.4" />
                    </linearGradient>
                </defs>
                <g class="anim-subtle-spin">
                    <circle cx="250" cy="250" r="230" stroke="url(#faintGold)" stroke-width="0.7" stroke-dasharray="3 6" opacity="0.4" />
                    <circle cx="250" cy="250" r="215" stroke="url(#faintGold)" stroke-width="0.8" opacity="0.3" />
                    <!-- Interlaced 8-pointed Star (Rub el Hizb) -->
                    <rect x="160" y="160" width="180" height="180" stroke="url(#faintGold)" stroke-width="1.2" fill="none" opacity="0.6" />
                    <rect x="160" y="160" width="180" height="180" transform="rotate(45 250 250)" stroke="url(#faintGold)" stroke-width="1.2" fill="none" opacity="0.6" />
                    <circle cx="250" cy="250" r="28" stroke="url(#faintGold)" stroke-width="1" fill="none" opacity="0.5" />
                    <circle cx="250" cy="250" r="4" fill="#DFB76C" opacity="0.7" />
                </g>
            </svg>
        </div>

        <!-- Dynamic Hijri Moon (Phase and size calculated from Hijri lunar day) -->
        <div class="hijri-moon-wrap" id="hijriMoonWrap" title="مرحلة القمر لليوم الهجري">
            <div class="moon-svg-box" id="moonSvgBox"></div>
            <div class="moon-hijri-caption" id="moonHijriCaption">...</div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="/" class="back-link">
            <span>←</span>
            <span>استوديو المحطات</span>
        </a>
        <div class="live-chip">
            <span class="pulse-dot"></span>
            <span>بث مباشر • 128K MP3</span>
        </div>
    </header>

    <!-- Main Player Card -->
    <main>
        <!-- Icon Cover -->
        <div class="art-box" id="artBox">
            {{STATION_ICON}}
        </div>

        <h1 class="station-name">{{STATION_NAME}}</h1>
        <div class="station-category">{{STATION_CATEGORY}}</div>
        <p class="station-desc">{{STATION_DESC}}</p>

        <!-- Waveform Visualizer -->
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Big Play Button -->
        <button class="play-btn-circle" id="playBtn" onclick="togglePlay()">
            <span id="playIcon">▶</span>
        </button>

        <!-- Volume Control -->
        <div class="vol-container">
            <span class="vol-icon" id="volIcon" onclick="toggleMute()">🔊</span>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        </div>

        <!-- Download & Share Actions -->
        <div class="action-row">
            <a href="/station/{{STATION_ID}}.m3u" class="action-btn" download title="تحميل ملف التشغيل لويندوز ميديا بلاير">
                <span>📥</span>
                <span>تشغيل في WMP</span>
            </a>
            <button class="action-btn" onclick="shareStation()" title="مشاركة رابط المحطة">
                <span>🔗</span>
                <span>مشاركة الرابط</span>
            </button>
            <button class="action-btn" onclick="copyStreamUrl()" title="نسخ رابط البث المباشر">
                <span>📋</span>
                <span>نسخ البث</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <span>Designed and developed by <a href="https://xecod.com" target="_blank" style="color: var(--theme-accent); font-weight: bold; text-decoration: none;">xecod.com</a></span>
        </div>
        <a href="/" class="other-stations-link">
            <span>جميع المحطات</span>
            <span>→</span>
        </a>
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="audioStream" preload="none"></audio>

    <script>
        const stationId = "{{STATION_ID}}";
        const streamUrl = "/station/" + stationId;
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const artBox = document.getElementById('artBox');
        const visualizer = document.getElementById('visualizer');
        const volIcon = document.getElementById('volIcon');
        const volSlider = document.getElementById('volSlider');

        let isPlaying = false;

        function togglePlay() {
            if (!isPlaying) {
                audio.src = streamUrl;
                audio.play().then(() => {
                    isPlaying = true;
                    updateUI(true);
                }).catch(err => {
                    console.log("Playback error:", err);
                });
            } else {
                audio.pause();
                audio.src = "";
                isPlaying = false;
                updateUI(false);
            }
        }

        function updateUI(playing) {
            const bg = document.getElementById('islamicBg');
            if (playing) {
                playIcon.textContent = "⏸";
                artBox.classList.add('playing');
                visualizer.classList.add('active');
                if (bg) bg.classList.add('playing-active');
            } else {
                playIcon.textContent = "▶";
                artBox.classList.remove('playing');
                visualizer.classList.remove('active');
                if (bg) bg.classList.remove('playing-active');
            }
        }

        // ========================================================
        // 1. DYNAMIC HIJRI MOON CALCULATION & RENDERING
        // ========================================================
        function getHijriDateInfo() {
            let day = 1;
            let formattedDate = "";
            const locales = ['en-u-ca-islamic-umalqura', 'en-u-ca-islamic', 'en-u-ca-islamic-civil'];
            for (const loc of locales) {
                try {
                    const parts = new Intl.DateTimeFormat(loc, { day: 'numeric' }).formatToParts(new Date());
                    const dayPart = parts.find(p => p.type === 'day');
                    if (dayPart) {
                        const val = parseInt(dayPart.value, 10);
                        if (!isNaN(val) && val >= 1 && val <= 30) {
                            day = val;
                            break;
                        }
                    }
                } catch(e) {}
            }
            if (!day || day < 1 || day > 30) {
                const knownNewMoon = new Date("2026-09-11T12:00:00Z").getTime();
                const diffDays = (Date.now() - knownNewMoon) / (1000 * 60 * 60 * 24);
                day = Math.floor(diffDays % 29.53059) + 1;
            }
            try {
                formattedDate = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura', { day: 'numeric', month: 'long' }).format(new Date());
            } catch(e) {
                formattedDate = day + " ربيع الآخر";
            }
            return { day: Math.min(Math.max(day, 1), 30), formattedDate };
        }

        function renderHijriMoon() {
            const { day, formattedDate } = getHijriDateInfo();
            const moonSvgBox = document.getElementById('moonSvgBox');
            const moonCaption = document.getElementById('moonHijriCaption');
            if (!moonSvgBox) return;

            // Size scaling based on Hijri day (crescents are smaller ~0.82, full moon grows to ~1.28)
            const scale = 0.82 + 0.44 * (1 - Math.abs(day - 14.5) / 14.5);
            moonSvgBox.style.transform = `scale(${scale.toFixed(3)})`;

            // Astronomical Phase Calculation
            const r = 36;
            let illuminatedPath = "";
            let phaseName = "";

            if (day >= 13 && day <= 16) {
                phaseName = "بدر التمام";
                illuminatedPath = `<circle cx="50" cy="50" r="${r}" fill="url(#moonIvoryGrad)" />`;
            } else {
                const phi = ((day - 1) / 29.5) * 2 * Math.PI;
                const cosPhi = Math.cos(phi);
                const rx = Math.max(Math.abs(r * cosPhi), 0.5);

                if (day < 14) {
                    phaseName = cosPhi > 0 ? (day <= 3 ? "هلال أول" : "هلال متزايد") : "أحدب متزايد";
                    const sweepTerm = cosPhi > 0 ? 0 : 1;
                    const pathD = `M 50,${50 - r} A ${r},${r} 0 0 1 50,${50 + r} A ${rx.toFixed(1)},${r} 0 0 ${sweepTerm} 50,${50 - r} Z`;
                    illuminatedPath = `<path d="${pathD}" fill="url(#moonIvoryGrad)" />`;
                } else {
                    phaseName = cosPhi > 0 ? (day >= 27 ? "هلال أخير" : "هلال متناقص") : "أحدب متناقص";
                    const sweepTerm = cosPhi > 0 ? 0 : 1;
                    const pathD = `M 50,${50 - r} A ${r},${r} 0 0 0 50,${50 + r} A ${rx.toFixed(1)},${r} 0 0 ${sweepTerm} 50,${50 - r} Z`;
                    illuminatedPath = `<path d="${pathD}" fill="url(#moonIvoryGrad)" />`;
                }
            }

            moonSvgBox.innerHTML = `
                <svg width="58" height="58" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="moonIvoryGrad" cx="42%" cy="38%" r="60%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="65%" stop-color="#FFF5D6" />
                            <stop offset="100%" stop-color="#DFB76C" />
                        </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="${r}" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.75" />
                    ${illuminatedPath}
                </svg>
            `;

            if (moonCaption) {
                moonCaption.textContent = `${formattedDate} • ${phaseName}`;
            }
        }

        // ========================================================
        // 2. HOUR-BASED DYNAMIC BACKGROUND & CELESTIAL AMBIANCE
        // ========================================================
        let currentStarIntensity = 0.65;

        function applyHourTheme() {
            const now = new Date();
            const hour = now.getHours() + now.getMinutes() / 60;
            let bg1, bg2, starOpacity, glowColor;

            if (hour >= 0 && hour < 4.5) {
                // Tahajjud / Deep Midnight
                bg1 = "#02050e";
                bg2 = "#060f1e";
                starOpacity = 0.95;
                glowColor = "rgba(30, 58, 138, 0.25)";
            } else if (hour >= 4.5 && hour < 6.5) {
                // Fajr / Dawn
                bg1 = "#050e18";
                bg2 = "#122428";
                starOpacity = 0.65;
                glowColor = "rgba(212, 175, 55, 0.20)";
            } else if (hour >= 6.5 && hour < 11.5) {
                // Duha / Morning
                bg1 = "#021813";
                bg2 = "#052c22";
                starOpacity = 0.35;
                glowColor = "rgba(16, 185, 129, 0.20)";
            } else if (hour >= 11.5 && hour < 17.5) {
                // Dhuhr & Asr
                bg1 = "#031c15";
                bg2 = "#062a20";
                starOpacity = 0.35;
                glowColor = "rgba(212, 175, 55, 0.22)";
            } else {
                // Maghrib & Isha
                bg1 = "#080718";
                bg2 = "#120e24";
                starOpacity = 0.85;
                glowColor = "rgba(168, 85, 247, 0.20)";
            }

            currentStarIntensity = starOpacity;
            document.body.style.background = `linear-gradient(180deg, ${bg1} 0%, ${bg2} 100%)`;
            document.documentElement.style.setProperty('--theme-bg1', bg1);
            document.documentElement.style.setProperty('--theme-bg2', bg2);
            document.documentElement.style.setProperty('--theme-glow', glowColor);
        }

        // ========================================================
        // 3. GLOWING STAR DOTS CELESTIAL CANVAS
        // ========================================================
        (function initGlowingStarCanvas() {
            const canvas = document.getElementById('celestialCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return;

            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }, { passive: true });

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const starCount = 70;
            const stars = [];

            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.3 + 0.7,
                    alpha: Math.random() * 0.7 + 0.2,
                    targetAlpha: Math.random() * 0.7 + 0.2,
                    twinkleSpeed: Math.random() * 0.012 + 0.004,
                    glow: Math.random() * 5 + 3,
                    golden: Math.random() > 0.45,
                    vx: (Math.random() - 0.5) * 0.08,
                    vy: -Math.random() * 0.12 - 0.02
                });
            }

            let lastTime = performance.now();
            function render(time) {
                const dt = Math.min((time - lastTime) / 16.67, 2.0);
                lastTime = time;

                ctx.clearRect(0, 0, width, height);
                const motionMult = prefersReducedMotion ? 0.1 : (isPlaying ? 1.25 : 1.0);

                for (let i = 0; i < starCount; i++) {
                    const s = stars[i];

                    if (s.alpha < s.targetAlpha) {
                        s.alpha += s.twinkleSpeed * dt;
                        if (s.alpha >= s.targetAlpha) s.targetAlpha = Math.random() * 0.75 + 0.15;
                    } else {
                        s.alpha -= s.twinkleSpeed * dt;
                        if (s.alpha <= s.targetAlpha) s.targetAlpha = Math.random() * 0.75 + 0.15;
                    }

                    s.x += s.vx * motionMult * dt;
                    s.y += s.vy * motionMult * dt;

                    if (s.y < -10) { s.y = height + 10; s.x = Math.random() * width; }
                    if (s.x < -10) s.x = width + 10;
                    if (s.x > width + 10) s.x = -10;

                    const effectiveAlpha = Math.min(Math.max(s.alpha * currentStarIntensity, 0.05), 1.0);

                    ctx.save();
                    ctx.shadowBlur = s.glow;
                    ctx.shadowColor = s.golden 
                        ? `rgba(255, 235, 170, ${effectiveAlpha.toFixed(3)})` 
                        : `rgba(225, 240, 255, ${effectiveAlpha.toFixed(3)})`;
                    ctx.fillStyle = s.golden 
                        ? `rgba(255, 245, 205, ${effectiveAlpha.toFixed(3)})` 
                        : `rgba(255, 255, 255, ${effectiveAlpha.toFixed(3)})`;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        })();

        // Initialize Theme & Moon
        applyHourTheme();
        renderHijriMoon();
        setInterval(applyHourTheme, 60000);

        function changeVolume(val) {
            audio.volume = val;
            volIcon.textContent = val == 0 ? "🔇" : (val < 0.5 ? "🔉" : "🔊");
        }

        function toggleMute() {
            if (audio.volume > 0) {
                audio.volume = 0;
                volSlider.value = 0;
                volIcon.textContent = "🔇";
            } else {
                audio.volume = 1;
                volSlider.value = 1;
                volIcon.textContent = "🔊";
            }
        }

        function copyStreamUrl() {
            const fullUrl = window.location.origin + streamUrl;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert("تم نسخ رابط البث المباشر بنجاح:\n" + fullUrl);
            });
        }

        function shareStation() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: "استمع الآن إلى " + document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert("تم نسخ رابط المحطة للمشاركة:\n" + window.location.href);
                });
            }
        }

        // Keep connection awake if screen sleeps
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && isPlaying && audio.paused) {
                audio.play().catch(() => {});
            }
        });
    </script>
</body>
