<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{STATION_NAME}} • بث مباشر</title>
    <meta name="description" content="{{STATION_DESC}}">
    <meta property="og:title" content="{{STATION_NAME}}">
    <meta property="og:description" content="{{STATION_DESC}}">
    <meta property="og:type" content="music.radio_station">
    <meta property="og:url" content="{{PAGE_URL}}">
    <style>
        :root {
            --theme-bg1: {{THEME_BG1}};
            --theme-bg2: {{THEME_BG2}};
            --theme-accent: {{THEME_ACCENT}};
            --theme-glow: {{THEME_GLOW}};
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--theme-bg1) 0%, #080c14 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* =========================================
           Islamic Arabesque & Celestial Background
           ========================================= */
        .islamic-bg-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-radial-glow {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-glow) 0%, rgba(212, 175, 55, 0.12) 35%, transparent 70%);
            filter: blur(70px);
            animation: spiritualBreathe 8s ease-in-out infinite;
            will-change: transform, opacity;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .playing-active .ambient-radial-glow {
            animation: spiritualBreathe 4.5s ease-in-out infinite;
            background: radial-gradient(circle, var(--theme-glow) 0%, rgba(212, 175, 55, 0.26) 45%, transparent 70%);
            filter: blur(60px);
            width: 750px;
            height: 750px;
        }

        #celestialCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.85;
            pointer-events: none;
        }

        .girih-mandala-wrap {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
            max-width: 150vw;
            max-height: 150vw;
            opacity: 0.65;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .playing-active .girih-mandala-wrap {
            opacity: 0.85;
        }

        @keyframes girihRotateClockwise {
            0% { transform: rotate(0deg) translateZ(0); }
            100% { transform: rotate(360deg) translateZ(0); }
        }

        @keyframes girihRotateCounter {
            0% { transform: rotate(0deg) translateZ(0); }
            100% { transform: rotate(-360deg) translateZ(0); }
        }

        @keyframes spiritualBreathe {
            0%, 100% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(0.96) translateZ(0);
            }
            50% {
                opacity: 1.0;
                transform: translate(-50%, -50%) scale(1.08) translateZ(0);
            }
        }

        @keyframes hilalGlowPulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); opacity: 0.85; }
            50% { filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.85)); opacity: 1.0; }
        }

        .anim-girih-clockwise {
            animation: girihRotateClockwise 140s linear infinite;
            transform-origin: 500px 500px;
            will-change: transform;
        }

        .anim-girih-counter {
            animation: girihRotateCounter 90s linear infinite;
            transform-origin: 500px 500px;
            will-change: transform;
        }

        .playing-active .anim-girih-clockwise {
            animation-duration: 90s;
        }

        .playing-active .anim-girih-counter {
            animation-duration: 55s;
        }

        .hilal-crescent {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: none;
            animation: hilalGlowPulse 7s ease-in-out infinite;
            z-index: 5;
        }

        @media (max-width: 640px) {
            .hilal-crescent {
                top: 12px;
                right: 12px;
                transform: scale(0.8);
            }
            .girih-mandala-wrap {
                width: 580px;
                height: 580px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-girih-clockwise,
            .anim-girih-counter,
            .ambient-radial-glow,
            .hilal-crescent {
                animation: none !important;
            }
        }

        /* Navigation Header */
        header {
            position: relative;
            z-index: 10;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .live-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        /* Player Card Content */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        /* Artwork Icon Cover */
        .art-box {
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px var(--theme-glow);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            margin-bottom: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .art-box.playing {
            animation: floatArt 3s ease-in-out infinite;
            border-color: var(--theme-accent);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 45px var(--theme-glow);
        }

        @keyframes floatArt {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        .station-name {
            font-size: 23px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .station-category {
            font-size: 13px;
            color: var(--theme-accent);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .station-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
            max-width: 380px;
        }

        /* Animated Audio Visualizer Bars */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 36px;
            margin-bottom: 24px;
        }

        .bar {
            width: 4px;
            height: 6px;
            background: var(--theme-accent);
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .visualizer.active .bar:nth-child(1) { animation: bounce 0.9s infinite alternate; }
        .visualizer.active .bar:nth-child(2) { animation: bounce 0.6s infinite 0.1s alternate; }
        .visualizer.active .bar:nth-child(3) { animation: bounce 1.1s infinite 0.2s alternate; }
        .visualizer.active .bar:nth-child(4) { animation: bounce 0.7s infinite 0.3s alternate; }
        .visualizer.active .bar:nth-child(5) { animation: bounce 1.0s infinite 0.15s alternate; }
        .visualizer.active .bar:nth-child(6) { animation: bounce 0.8s infinite 0.25s alternate; }
        .visualizer.active .bar:nth-child(7) { animation: bounce 1.2s infinite 0.05s alternate; }

        @keyframes bounce {
            0% { height: 6px; opacity: 0.4; }
            100% { height: 32px; opacity: 1; }
        }

        /* Large Touch Play Button */
        .play-btn-circle {
            width: 82px;
            height: 82px;
            background: var(--theme-accent);
            color: #040812;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 24px var(--theme-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 24px;
        }

        .play-btn-circle:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 36px var(--theme-glow);
        }

        .play-btn-circle:active {
            transform: scale(0.95);
        }

        /* Volume Slider Row */
        .vol-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 220px;
            margin-bottom: 28px;
        }

        .vol-icon {
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
        }

        .vol-slider {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            accent-color: var(--theme-accent);
        }

        /* Action Buttons Grid */
        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--theme-accent);
        }

        /* Station Switcher Drawer */
        footer {
            position: relative;
            z-index: 10;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .other-stations-link {
            color: var(--theme-accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .other-stations-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Islamic Arabesque & Celestial Ambient Background -->
    <div class="islamic-bg-container" id="islamicBg">
        <div class="ambient-radial-glow"></div>
        <canvas id="celestialCanvas"></canvas>

        <!-- Rotating Girih Mandala -->
        <div class="girih-mandala-wrap">
            <svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#DFB76C" stop-opacity="0.85" />
                        <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="#997526" stop-opacity="0.85" />
                    </linearGradient>
                    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- LAYER 1: Clockwise Outer 16-Fold Girih Strapwork & Rosette -->
                <g class="anim-girih-clockwise">
                    <circle cx="500" cy="500" r="470" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
                    <circle cx="500" cy="500" r="440" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.45" />
                    <circle cx="500" cy="500" r="380" stroke="url(#goldGradient)" stroke-width="0.75" opacity="0.25" />

                    <!-- 16 Radial Rays with Arabesque Diamond Terminals -->
                    <g stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.4">
                        <line x1="500" y1="60" x2="500" y2="120" />
                        <line x1="500" y1="940" x2="500" y2="880" />
                        <line x1="60" y1="500" x2="120" y2="500" />
                        <line x1="940" y1="500" x2="880" y2="500" />
                        <line x1="189" y1="189" x2="231" y2="231" />
                        <line x1="811" y1="811" x2="769" y2="769" />
                        <line x1="811" y1="189" x2="769" y2="231" />
                        <line x1="189" y1="811" x2="231" y2="769" />
                        <line x1="324" y1="76" x2="347" y2="131" />
                        <line x1="676" y1="924" x2="653" y2="869" />
                        <line x1="676" y1="76" x2="653" y2="131" />
                        <line x1="324" y1="924" x2="347" y2="869" />
                        <line x1="76" y1="324" x2="131" y2="347" />
                        <line x1="924" y1="676" x2="869" y2="653" />
                        <line x1="924" y1="324" x2="869" y2="347" />
                        <line x1="76" y1="676" x2="131" y2="653" />
                    </g>

                    <!-- Hexadecagon / 16-Point Girih Star Polygon Lattice -->
                    <g stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.38">
                        <polygon points="500,60 626,112 730,195 801,304 832,431 821,561 768,679 676,771 556,827 426,835 303,797 201,718 135,608 113,478 139,349 212,238" />
                        <polygon points="500,940 374,888 270,805 199,696 168,569 179,439 232,321 324,229 444,173 574,165 697,203 799,282 865,392 887,522 861,651 788,762" />
                    </g>

                    <!-- Girih Petal Arcs -->
                    <g stroke="url(#goldGradient)" stroke-width="0.9" fill="rgba(212, 175, 55, 0.02)" opacity="0.35">
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(45 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(90 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(135 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(180 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(225 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(270 500 500)" />
                        <path d="M 500 120 Q 560 250 500 380 Q 440 250 500 120 Z" transform="rotate(315 500 500)" />
                    </g>
                </g>

                <!-- LAYER 2: Counter-Clockwise Inner Rub el Hizb (8-Pointed Star Medallion) -->
                <g class="anim-girih-counter" filter="url(#softGlow)">
                    <rect x="320" y="320" width="360" height="360" stroke="url(#goldGradient)" stroke-width="1.6" fill="none" opacity="0.55" />
                    <rect x="320" y="320" width="360" height="360" transform="rotate(45 500 500)" stroke="url(#goldGradient)" stroke-width="1.6" fill="none" opacity="0.55" />

                    <!-- Middle Interlocking 8-Pointed Star (Rotated 22.5 deg) -->
                    <g transform="rotate(22.5 500 500)" stroke="url(#goldGradient)" stroke-width="1" opacity="0.45">
                        <rect x="360" y="360" width="280" height="280" fill="none" />
                        <rect x="360" y="360" width="280" height="280" transform="rotate(45 500 500)" fill="none" />
                    </g>

                    <!-- Inner Sacred Rosette Pattern -->
                    <g fill="url(#goldGradient)" fill-opacity="0.07" stroke="url(#goldGradient)" stroke-width="1.1" opacity="0.75">
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(45 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(90 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(135 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(180 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(225 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(270 500 500)" />
                        <path d="M 500 340 C 515 390 535 410 500 460 C 465 410 485 390 500 340 Z" transform="rotate(315 500 500)" />
                    </g>

                    <!-- Center Medallion Rings -->
                    <circle cx="500" cy="500" r="65" stroke="url(#goldGradient)" stroke-width="1.8" fill="rgba(3, 23, 19, 0.4)" opacity="0.75" />
                    <circle cx="500" cy="500" r="50" stroke="url(#goldGradient)" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.6" />
                    <circle cx="500" cy="500" r="10" fill="#DFB76C" opacity="0.85" />
                </g>
            </svg>
        </div>

        <!-- Glowing Hilal Crescent Moon & Venus Star -->
        <div class="hilal-crescent">
            <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 68 18 C 45 22 28 42 28 66 C 28 88 44 106 65 110 C 40 104 22 83 22 58 C 22 34 38 15 62 10 C 64 9.5 66.5 9.2 68 9 C 67.5 12 67.5 15 68 18 Z" fill="url(#hilalGoldGradient)" />
                <g transform="translate(68, 28) scale(0.65)">
                    <polygon points="10,0 12.5,7.5 20,10 12.5,12.5 10,20 7.5,12.5 0,10 7.5,7.5" fill="#F9E79F" />
                    <circle cx="10" cy="10" r="2" fill="#FFFFFF" />
                </g>
                <defs>
                    <linearGradient id="hilalGoldGradient" x1="20%" y1="10%" x2="90%" y2="90%">
                        <stop offset="0%" stop-color="#FFF2B2" />
                        <stop offset="60%" stop-color="#DFB76C" />
                        <stop offset="100%" stop-color="#AA7C11" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="/" class="back-link">
            <span>←</span>
            <span>استوديو المحطات</span>
        </a>
        <div class="live-chip">
            <span class="pulse-dot"></span>
            <span>بث مباشر • 128K MP3</span>
        </div>
    </header>

    <!-- Main Player Card -->
    <main>
        <!-- Icon Cover -->
        <div class="art-box" id="artBox">
            {{STATION_ICON}}
        </div>

        <h1 class="station-name">{{STATION_NAME}}</h1>
        <div class="station-category">{{STATION_CATEGORY}}</div>
        <p class="station-desc">{{STATION_DESC}}</p>

        <!-- Waveform Visualizer -->
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Big Play Button -->
        <button class="play-btn-circle" id="playBtn" onclick="togglePlay()">
            <span id="playIcon">▶</span>
        </button>

        <!-- Volume Control -->
        <div class="vol-container">
            <span class="vol-icon" id="volIcon" onclick="toggleMute()">🔊</span>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        </div>

        <!-- Download & Share Actions -->
        <div class="action-row">
            <a href="/station/{{STATION_ID}}.m3u" class="action-btn" download title="تحميل ملف التشغيل لويندوز ميديا بلاير">
                <span>📥</span>
                <span>تشغيل في WMP</span>
            </a>
            <button class="action-btn" onclick="shareStation()" title="مشاركة رابط المحطة">
                <span>🔗</span>
                <span>مشاركة الرابط</span>
            </button>
            <button class="action-btn" onclick="copyStreamUrl()" title="نسخ رابط البث المباشر">
                <span>📋</span>
                <span>نسخ البث</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <span>Designed and developed by <a href="https://xecod.com" target="_blank" style="color: var(--theme-accent); font-weight: bold; text-decoration: none;">xecod.com</a></span>
        </div>
        <a href="/" class="other-stations-link">
            <span>جميع المحطات</span>
            <span>→</span>
        </a>
    </footer>

    <!-- Hidden Audio Element -->
    <audio id="audioStream" preload="none"></audio>

    <script>
        const stationId = "{{STATION_ID}}";
        const streamUrl = "/station/" + stationId;
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const artBox = document.getElementById('artBox');
        const visualizer = document.getElementById('visualizer');
        const volIcon = document.getElementById('volIcon');
        const volSlider = document.getElementById('volSlider');

        let isPlaying = false;

        function togglePlay() {
            if (!isPlaying) {
                audio.src = streamUrl;
                audio.play().then(() => {
                    isPlaying = true;
                    updateUI(true);
                }).catch(err => {
                    console.log("Playback error:", err);
                });
            } else {
                audio.pause();
                audio.src = "";
                isPlaying = false;
                updateUI(false);
            }
        }

        function updateUI(playing) {
            const bg = document.getElementById('islamicBg');
            if (playing) {
                playIcon.textContent = "⏸";
                artBox.classList.add('playing');
                visualizer.classList.add('active');
                if (bg) bg.classList.add('playing-active');
            } else {
                playIcon.textContent = "▶";
                artBox.classList.remove('playing');
                visualizer.classList.remove('active');
                if (bg) bg.classList.remove('playing-active');
            }
        }

        // Lightweight Celestial Stars & Dust Particle Canvas
        (function initCelestialCanvas() {
            const canvas = document.getElementById('celestialCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return;

            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }, { passive: true });

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const particleCount = 40;
            const particles = [];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.1,
                    targetAlpha: Math.random() * 0.7 + 0.1,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: -Math.random() * 0.25 - 0.05,
                    twinkleSpeed: Math.random() * 0.015 + 0.005,
                    golden: Math.random() > 0.4
                });
            }

            let lastTime = performance.now();
            function render(time) {
                const dt = Math.min((time - lastTime) / 16.67, 2.0);
                lastTime = time;

                ctx.clearRect(0, 0, width, height);
                const motionMult = prefersReducedMotion ? 0.2 : (isPlaying ? 1.35 : 1.0);

                for (let i = 0; i < particleCount; i++) {
                    const p = particles[i];
                    if (p.alpha < p.targetAlpha) {
                        p.alpha += p.twinkleSpeed * dt;
                        if (p.alpha >= p.targetAlpha) p.targetAlpha = Math.random() * 0.75 + 0.1;
                    } else {
                        p.alpha -= p.twinkleSpeed * dt;
                        if (p.alpha <= p.targetAlpha) p.targetAlpha = Math.random() * 0.75 + 0.1;
                    }

                    p.x += p.vx * motionMult * dt;
                    p.y += p.vy * motionMult * dt;

                    if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.golden 
                        ? 'rgba(223, 183, 108, ' + p.alpha.toFixed(3) + ')' 
                        : 'rgba(240, 246, 252, ' + (p.alpha * 0.8).toFixed(3) + ')';
                    ctx.fill();
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        })();

        function changeVolume(val) {
            audio.volume = val;
            volIcon.textContent = val == 0 ? "🔇" : (val < 0.5 ? "🔉" : "🔊");
        }

        function toggleMute() {
            if (audio.volume > 0) {
                audio.volume = 0;
                volSlider.value = 0;
                volIcon.textContent = "🔇";
            } else {
                audio.volume = 1;
                volSlider.value = 1;
                volIcon.textContent = "🔊";
            }
        }

        function copyStreamUrl() {
            const fullUrl = window.location.origin + streamUrl;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert("تم نسخ رابط البث المباشر بنجاح:\n" + fullUrl);
            });
        }

        function shareStation() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: "استمع الآن إلى " + document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert("تم نسخ رابط المحطة للمشاركة:\n" + window.location.href);
                });
            }
        }

        // Keep connection awake if screen sleeps
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && isPlaying && audio.paused) {
                audio.play().catch(() => {});
            }
        });
    </script>
</body>
