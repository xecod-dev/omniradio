services:
  radio-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        APP_VERSION: ${APP_VERSION:-2.4.0}
    image: radio-app:latest
    container_name: radio-app
    restart: unless-stopped
    environment:
      - APP_VERSION=${APP_VERSION:-2.4.0}
      - APP_UPDATED=${APP_UPDATED:-2026-09-22}
      - PORT=9000
      - AUDIO_DIR=/app/audio
      - CONFIG_FILE=/app/config/stations.json
    ports:
      - "9000:9000"
      - "2121:2121"
      - "2122-2125:2122-2125"
    volumes:
      - /home/saas/radio/audio:/app/audio
      - /home/saas/radio/config:/app/config
      - /home/saas/radio/static:/app/static
      - /home/saas/radio/data:/app/data