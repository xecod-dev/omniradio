services:
  radio-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
        APP_VERSION: ${APP_VERSION:-2.6.4}
    image: radio-app:latest
    container_name: radio-app
    restart: unless-stopped
    # 2026-10-02 incident: the uvicorn parent leaked ~48 MiB/min (~2.8 GiB/hr)
    # while fanning out one ffmpeg transcode per station. It reached 12.4 GiB
    # in ~7h and starved the whole 16 GiB host (swap 100% full), which took
    # the unrelated mce-dashboard down with it -- /api/health went from 12 ms
    # to 8.4 s and the operator's browser timed out. Baseline RSS is ~225 MiB.
    # Cap it so a leak can never take down a co-tenant service again.
    mem_limit: 4g
    mem_reservation: 512m
    environment:
      - APP_VERSION=${APP_VERSION:-2.6.4}
      - APP_UPDATED=${APP_UPDATED:-2026-09-25}
      - PORT=9000
      - AUDIO_DIR=/app/audio
      - CONFIG_FILE=/app/config/stations.json
      # Icecast-compatible YP directory client (Internet-Radio.com et al.)
      # Set YP_URL to enable, e.g. http://icecast-yp.internet-radio.com
      - YP_URL=${YP_URL:-http://icecast-yp.internet-radio.com}
      - YP_ENABLED=${YP_ENABLED:-1}
      - YP_INTERVAL=${YP_INTERVAL:-60}
      # glibc malloc: release free pages to OS after each GC cycle.
      # Prevents the process from holding onto GiB of freed heap pages.
      # 131072 bytes (128 KB) trim threshold — aggressive enough to keep RSS sane.
      - MALLOC_TRIM_THRESHOLD_=131072
      - MALLOC_MMAP_THRESHOLD_=131072
    ports:
      - "9000:9000"
      - "2121:2121"
      - "2122-2125:2122-2125"
    volumes:
      - /home/saas/radio/audio:/app/audio
      - /home/saas/radio/config:/app/config
      - /home/saas/radio/static:/app/static
      - /home/saas/radio/data:/app/data